# T-004 — CI
#
# Führt bei jedem Push die Modulgrenzen-Prüfung aus T-003 und alle Unit-Tests aus.
# Falls kein GitHub genutzt wird: Der einzige relevante Befehl ist
# "./gradlew checkAll" — jede andere CI ruft ihn genauso auf.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Modulgrenzen und Tests
        run: ./gradlew checkAll --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew :ui:assembleDebug

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
